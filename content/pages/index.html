<!DOCTYPE html>

<html lang="en-CA">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <meta name="kicya-site-verification" content="b3a24264f4fd3a998cff0188c4741fb8a59edadda61ca589fb8af64111179aa1">

    <title>Chronic Cryptid</title>

    <link rel="alternate" type="application/rss+xml" title="RSS feed for my site"
        href="https://lichenthropic.neocities.org/rss.xml">

    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">

    <link id="index-style" rel="stylesheet" href="/index.css" type="text/css" media="all">

    <link id="colortheme" rel="stylesheet" href="https://lichenthropic.neocities.org/stylesheets/dark.css" type="text/css" media="none">

    <link id="filter" rel="stylesheet" href="https://lichenthropic.neocities.org/stylesheets/crt.css" type="text/css" media="all">

    <script type="module">
        import { fairyDustCursor } from "https://unpkg.com/cursor-effects@latest/dist/esm.js";
        new fairyDustCursor({
            colors: ["#8EBD00", "#A4FF2E", "#DCFF0F"],
            fairySymbol: "★",
        });
    </script>

</head>
<header>
    <div class="fairy-container">
        <details class="accessability-menu">
            <summary>
                <div>
                    <img id="access-fairy" src="https://lichenthropic.neocities.org/images/assets/navi.gif"
                        title="accessability fairy" alt="accessability menu" width="100px">
                </div>
                <br />
            </summary>
            <div class="accessability">
                <p style="text-align:center">ACCESSABILITY </p>
                <br />
                <div class="access-options">
                    <button class="filter" onclick="crtoff()">CRT OFF</button>
                    <button class="filter" onclick="crton()">CRT ON</button>
                    <button class="colortheme" onclick="darkmode()">DARK</button>
                    <button class="colortheme" onclick="lightmode()">LIGHT</button>
                </div>
            </div>
        </details>
    </div>
</header>
<body class="crt">
    <div id="preloader"></div>


    
<script>
        function crton() {
            document.getElementById('filter').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt.css');
            localStorage.setItem('filter', 'crt-on');
        }

        function crtoff() {
            document.getElementById('filter').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt-off.css');
            localStorage.setItem('filter', 'crt-off');
        }

        if (localStorage.getItem('filter') == 'crt-on') {
            crton();
        }

        if (localStorage.getItem('filter') == 'crt-off') {
            crtoff();
        }

</script>
<script>

        function lightmode() {
            document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/light.css');
            localStorage.setItem('theme', 'lightmode');
        }

        function darkmode() {
            document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/dark.css');
            localStorage.setItem('theme', 'darkmode');
        }

        if (localStorage.getItem('theme') == 'lightmode') {
            lightmode();
        }

        if (localStorage.getItem('theme') == 'darkmode') {
            darkmode();
        }

</script>
<style>
        /* Preloader */
        #preloader {
            background: black url("https://lichenthropic.neocities.org/images/assets/aniglobe.gif") no-repeat center;
            align-items: center;
            justify-content: center;
            width: 100%;
            display: flex;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 9999;
        }
</style>
<script>
        var loader = document.getElementById("preloader");

        function hideLoader() {
            if (!loader) return;
            fadeOut();
        }

        function fadeOut() {
            var op = 1;
            var fade = setInterval(function () {
                op -= 0.1;
                if (op <= 0) {
                    clearInterval(fade);
                    loader.style.display = "none";
                } else {
                    loader.style.opacity = op;
                }
            }, 40);
        }

        // Hide once everything has loaded
        window.addEventListener("load", hideLoader);

        // Force-hide after 8 seconds even if it can't load
        setTimeout(hideLoader, 8000);
</script>
</body>
</html>
