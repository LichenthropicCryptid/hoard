<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTER THE HOARD</title>
    <link rel="stylesheet" href="https://ChronicCryptid.neocities.org/style.css" type="text/css" media="all">
</head>

<body>
    <div id="preloader"></div>

    <main class="index">
        <div class="chain-border">
            <p><strong>YOU ARE ABOUT TO ENTER THE HOARD</strong><br />
                <br/>ahead you will find my collection of stamps, blinkies, banners, buttons, etc and flashing images on autoplay. take care and enjoy!
            </p>

            <div class="entry-buttons" style="text-align:center">
                <div class="p-border" id="enter" style="text-align:center">
                    <a href="https://ChronicCryptid.neocities.org/hoard.html" alt="entry link to main page">
                      ENTER
                    </a>
                </div>
                <br/>
            </div>
        </div>
    </main>

    <style>
        html {
            width: 100%;
        }
        #enter {
            margin: 0 auto;
            font-size: 100px;
            height:fit-content;
            width: fit-content;
            left: 17rem;
        }

        /* Preloader */
        #preloader {
            background: black url("https://ChronicCryptid.neocities.org/cdwiggle.gif") no-repeat center scale(3);
            align-items: center;
            justify-content: center;
            width: 100%;
            display: flex;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 9999;
        }
    </style>
    <script>
        var loader = document.getElementById("preloader");

        function hideLoader() {
            if (!loader) return;
            fadeOut();
        }

        function fadeOut() {
            var op = 1;
            var fade = setInterval(function () {
                op -= 0.1;
                if (op <= 0) {
                    clearInterval(fade);
                    loader.style.display = "none";
                } else {
                    loader.style.opacity = op;
                }
            }, 40);
        }

        // Hide once everything has loaded
        window.addEventListener("load", hideLoader);

        // Force-hide after 8 seconds even if it can't load
        setTimeout(hideLoader, 8000);
    </script>
</body>

</html>
